services:
  rtcstats-dashboard:
    image: rtcstats-dashboard
    build: .
    ports:
      - "9080:80"
    environment:
      # ── required ──
      DATABASE_URL: postgresql://postgres:rtcstatspass@172.17.0.1:5432/rtcstats
      SESSION_SECRET: demo-secret
      PASSWORD_HASH: 1d88c1d8cba7fb828501bc0fc97c72be:c77eb6825bf900aae721fed3ea66c61647efc55d11bffd0e3e142700579d921609c1b2970f54106c4ebfc50e3b8ffda22f50a80848022498683701f586ad5776
      # ── S3 / MinIO ──
      S3_ENDPOINT: http://172.17.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: rdvtest
      # ── routing ──
      BASE_PATH: "/rtcstats"          # set to "/myapp" to prefix all routes
      PORT: "3000"            # internal API port behind nginx
      # ── analyzer ──
      ANALYZER_POLL_INTERVAL_MS: "10000"
      ANALYZER_BATCH_SIZE: "100"
      # ── startup ──
      RUN_INIT: "true"        # set to "false" to skip migrations/roles/bucket setup
